<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News & Events - SVGMS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/logo1.png" type="image/png" />

    <style>
        /* ===== NEWS PAGE SPECIFIC STYLES ===== */
        .news-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem 2rem;
        }

        /* Page Title */
        .page-title {
            margin: 2rem 0;
            padding-bottom: 1rem;
            border-bottom: 3px solid var(--accent);
        }

        .page-title h1 {
            font-size: 2.5rem;
            color: var(--primary);
        }

        .page-title p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eee;
        }

        .category-tab {
            padding: 0.5rem 1.5rem;
            border: none;
            background: var(--bg-light);
            color: var(--text-muted);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .category-tab:hover {
            background: var(--accent);
            color: var(--primary);
        }

        .category-tab.active {
            background: var(--accent);
            color: var(--primary);
        }

        /* Posts Grid */
        .posts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .post-card {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--accent);
            transition: var(--transition);
        }

        .post-card:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .post-card .category-badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .post-card .category-badge.announcement { background: #e3f2fd; color: #1565c0; }
        .post-card .category-badge.event { background: #e8f5e9; color: #2e7d32; }
        .post-card .category-badge.exam { background: #fce4ec; color: #c62828; }
        .post-card .category-badge.achievement { background: #fff3e0; color: #e65100; }
        .post-card .category-badge.notice { background: #f3e5f5; color: #6a1b9a; }
        .post-card .category-badge.general { background: #f5f5f5; color: #616161; }

        .post-card .post-title {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 0.3rem;
        }

        .post-card .post-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .post-card .post-content {
            color: var(--text-dark);
            line-height: 1.6;
        }

        .post-card .post-actions {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .post-card .post-actions .pdf-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .post-card .post-actions .pdf-btn:hover {
            background: #c82333;
        }

        .no-posts {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .no-posts .big-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .news-wrapper {
                padding: 0 1rem 1rem;
            }
            .page-title h1 {
                font-size: 2rem;
            }
            .category-tabs {
                justify-content: center;
            }
            .category-tab {
                font-size: 0.8rem;
                padding: 0.4rem 1rem;
            }
            .post-card {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TOP RIBBON ===== -->
    <div class="top-ribbon">
        <div class="ribbon-welcome">WELCOME TO THE SVGMS BHIM</div>
        <div class="ribbon-info">
            <span><strong>REGION:</strong> RAJSAMAND</span>
            <span><strong>AFFILIATION NO:</strong> 0000000</span>
            <span><strong>SCHOOL CODE:</strong> 0000</span>
        </div>
    </div>

    <!-- ===== HEADER ===== -->
    <header class="main-header">
        <div class="brand-container">
            <a class="brand-link" href="index.html">
                <img class="logo-image" src="https://raw.githubusercontent.com/ishrawat/imagess/refs/heads/main/logo.jpg" alt="School Logo">
                <div class="brand-text">
                    <h1>Swami Vivekanand Govt. Model School</h1>
                    <p>Bhim, Rajasthan</p>
                </div>
            </a>
        </div>
    </header>

    <!-- ===== NAVIGATION ===== -->
    <div id="nav-placeholder"></div>

    <!-- ===== NEWS CONTENT ===== -->
    <div class="news-wrapper">

        <!-- Page Title -->
        <div class="page-title">
            <h1> News & Events</h1>
            <p>Stay updated with the latest happenings at SVGMS</p>
        </div>

        <!-- Category Tabs -->
        <div class="category-tabs" id="categoryTabs">
            <button class="category-tab active" data-category="all"> All</button>
            <button class="category-tab" data-category="Announcement"> Announcement</button>
            <button class="category-tab" data-category="Event"> Event</button>
            <button class="category-tab" data-category="Exam Update"> Exam Update</button>
            <button class="category-tab" data-category="Achievement"> Achievement</button>
            <button class="category-tab" data-category="Notice"> Notice</button>
            <button class="category-tab" data-category="General"> General</button>
        </div>

        <!-- Posts -->
        <div id="postsContainer" class="posts-grid">
            <div class="no-posts">
                <div class="big-icon">📰</div>
                <p>Loading posts...</p>
            </div>
        </div>

    </div>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>&copy; 2026 Swami Vivekanand Govt. Model School, Bhim. All Rights Reserved.</p>
    </footer>

    <!-- ===== FIREBASE SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyAHmBCyGlSo1puz1LZ7k-4twg_XAcOqyRA",
            authDomain: "svgms-backend.firebaseapp.com",
            projectId: "svgms-backend",
            storageBucket: "svgms-backend.firebasestorage.app",
            messagingSenderId: "1065359559935",
            appId: "1:1065359559935:web:977cea73a68e05813750ca"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ===== DOM REFS =====
        const postsContainer = document.getElementById('postsContainer');
        const categoryTabs = document.querySelectorAll('.category-tab');

        // ===== LOAD POSTS =====
        async function loadPosts(category = 'all') {
            postsContainer.innerHTML = '<div class="no-posts"><div class="big-icon">📰</div><p>Loading posts...</p></div>';

            try {
                let query = db.collection('posts');

                if (category !== 'all') {
                    query = query.where('category', '==', category);
                }

                const snapshot = await query.get();

                if (snapshot.empty) {
                    postsContainer.innerHTML = `
                        <div class="no-posts">
                            <div class="big-icon">📭</div>
                            <p>No posts found in this category.</p>
                        </div>
                    `;
                    return;
                }

                // Convert to array and sort manually
                const posts = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    data.id = doc.id;
                    posts.push(data);
                });
                
                // Sort by date (newest first)
                posts.sort((a, b) => {
                    const dateA = a.date ? new Date(a.date) : new Date(0);
                    const dateB = b.date ? new Date(b.date) : new Date(0);
                    return dateB - dateA;
                });

                postsContainer.innerHTML = '';
                posts.forEach(post => {
                    // Get category badge color
                    let badgeClass = 'general';
                    const cat = post.category || 'General';
                    if (cat === 'Announcement' || cat === 'Announcements') badgeClass = 'announcement';
                    else if (cat === 'Event' || cat === 'Events') badgeClass = 'event';
                    else if (cat === 'Exam Update' || cat === 'Exam Updates') badgeClass = 'exam';
                    else if (cat === 'Achievement' || cat === 'Achievements') badgeClass = 'achievement';
                    else if (cat === 'Notice' || cat === 'Notices') badgeClass = 'notice';

                    // Format date
                    const postDate = post.date ? new Date(post.date) : new Date();
                    const formattedDate = postDate.toLocaleDateString('en-IN', {
                        day: '2-digit',
                        month: 'short',
                        year: 'numeric'
                    });

                    // PDF button if exists
                    let pdfHtml = '';
                    if (post.pdfUrl) {
                        pdfHtml = `
                            <a href="${post.pdfUrl}" target="_blank" class="pdf-btn">
                                📄 Download PDF
                            </a>
                        `;
                    }

                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.innerHTML = `
                        <span class="category-badge ${badgeClass}">${post.category || 'General'}</span>
                        <h2 class="post-title">${post.title}</h2>
                        <div class="post-meta">
                            📅 ${formattedDate} | 👤 ${post.author || 'Teacher'}
                        </div>
                        <div class="post-content">${post.content}</div>
                        <div class="post-actions">
                            ${pdfHtml}
                        </div>
                    `;
                    postsContainer.appendChild(card);
                });

            } catch (error) {
                console.error('Error loading posts:', error);
                postsContainer.innerHTML = `
                    <div class="no-posts">
                        <div class="big-icon">❌</div>
                        <p>Error loading posts. Please refresh.</p>
                    </div>
                `;
            }
        }

        // ===== CATEGORY TABS =====
        categoryTabs.forEach(tab => {
            tab.addEventListener('click', function() {
                categoryTabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                loadPosts(this.dataset.category);
            });
        });

        // ===== LOAD ON PAGE LOAD =====
        document.addEventListener('DOMContentLoaded', function() {
            loadPosts('all');
        });
    </script>
    
    <script>
    // Load navigation
    fetch('nav.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('nav-placeholder').innerHTML = data;
        });
</script>

</body>
</html>
