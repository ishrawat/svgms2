<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awards & Achievements - SVGMS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/logo1.png" type="image/png" />

    <style>
        .page-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }

        .page-title {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid var(--accent);
        }

        .page-title h1 {
            font-size: 2rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .page-title p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 0.6rem 1.5rem;
            border: none;
            background: var(--bg-light);
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .tab-btn:hover {
            background: var(--accent);
            color: var(--primary);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Awards Grid */
        .awards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .award-card {
            background: var(--white);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border-top: 4px solid var(--accent);
            transition: var(--transition);
            text-align: center;
            padding-bottom: 1rem;
        }

        .award-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .award-card .award-photo {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--bg-light);
        }

        .award-card .award-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            margin: 0.8rem 0 0.2rem;
            padding: 0 1rem;
        }

        .award-card .award-detail {
            font-size: 0.9rem;
            color: var(--text-dark);
            padding: 0 1rem;
            margin-bottom: 0.2rem;
        }

        .award-card .award-highlight {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 600;
            padding: 0 1rem;
            margin-bottom: 0.2rem;
        }

        .award-card .award-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 0 1rem;
        }

        .award-card .award-message {
            font-size: 0.9rem;
            color: var(--text-muted);
            padding: 0 1rem;
            margin-top: 0.3rem;
            font-style: italic;
            line-height: 1.5;
        }

        .no-awards {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .no-awards .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .alumni-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .alumni-card {
            background: var(--white);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border-top: 4px solid var(--accent);
            transition: var(--transition);
            text-align: center;
            padding-bottom: 1.2rem;
        }

        .alumni-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .alumni-card .alumni-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 1.2rem auto 0.5rem;
            border: 3px solid var(--accent);
            background: var(--bg-light);
        }

        .alumni-card .alumni-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.2rem;
        }

        .alumni-card .alumni-batch {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .alumni-card .alumni-profession {
            font-size: 1rem;
            color: var(--text-dark);
            font-weight: 500;
            margin-bottom: 0.2rem;
        }

        .alumni-card .alumni-achievement {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.3rem;
            padding: 0 1rem;
        }

        .alumni-card .alumni-message {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            padding: 0 1rem;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .page-wrapper {
                padding: 1rem 0.8rem 2rem;
            }
            .page-title h1 {
                font-size: 1.5rem;
            }
            .awards-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 1rem;
            }
            .alumni-grid {
                grid-template-columns: 1fr;
            }
            .award-card .award-photo {
                height: 160px;
            }
            .tab-btn {
                font-size: 0.8rem;
                padding: 0.4rem 1rem;
            }
            .alumni-card .alumni-photo {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .awards-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }
            .award-card .award-photo {
                height: 130px;
            }
            .award-card .award-name {
                font-size: 0.9rem;
            }
            .award-card .award-detail {
                font-size: 0.8rem;
            }
            .tab-btn {
                font-size: 0.7rem;
                padding: 0.3rem 0.7rem;
            }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>
    <div id="nav-placeholder"></div>

    <div class="page-wrapper">

        <div class="page-title">
            <h1>🏆 Awards & Achievements</h1>
            <p>Recognizing excellence in academics, competitions, and beyond</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-category="competition">🏅 Competition Winners</button>
            <button class="tab-btn" data-category="topper">📚 Class Toppers</button>
            <button class="tab-btn" data-category="alumni">🎓 Proud Alumni</button>
        </div>

        <!-- Tab Content: Competition Winners -->
        <div id="tab-competition" class="tab-content active">
            <div id="competitionContainer" class="awards-grid">
                <div class="no-awards">
                    <span class="icon">🏅</span>
                    <p>Loading competition winners...</p>
                </div>
            </div>
        </div>

        <!-- Tab Content: Class Toppers -->
        <div id="tab-topper" class="tab-content">
            <div id="topperContainer" class="awards-grid">
                <div class="no-awards">
                    <span class="icon">📚</span>
                    <p>Loading class toppers...</p>
                </div>
            </div>
        </div>

        <!-- Tab Content: Proud Alumni -->
        <div id="tab-alumni" class="tab-content">
            <div id="alumniContainer" class="alumni-grid">
                <div class="no-awards">
                    <span class="icon">🎓</span>
                    <p>Loading proud alumni...</p>
                </div>
            </div>
        </div>

    </div>

    <div id="footer-placeholder"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // ===== LOAD HEADER, NAV, FOOTER =====
        fetch('header.html').then(r => r.text()).then(data => document.getElementById('header-placeholder').innerHTML = data);
        fetch('nav.html').then(r => r.text()).then(data => document.getElementById('nav-placeholder').innerHTML = data);
        fetch('footer.html').then(r => r.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);

        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyAHmBCyGlSo1puz1LZ7k-4twg_XAcOqyRA",
            authDomain: "svgms-backend.firebaseapp.com",
            projectId: "svgms-backend",
            storageBucket: "svgms-backend.firebasestorage.app",
            messagingSenderId: "1065359559935",
            appId: "1:1065359559935:web:977cea73a68e05813750ca"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ===== LOAD AWARDS =====
        async function loadAwards(category, containerId) {
            const container = document.getElementById(containerId);

            try {
                const snapshot = await db.collection('awards')
                    .where('category', '==', category)
                    .orderBy('year', 'desc')
                    .get();

                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="no-awards">
                            <span class="icon">📭</span>
                            <p>No records found in this category.</p>
                        </div>
                    `;
                    return;
                }

                let html = '';

                if (category === 'alumni') {
                    // Alumni display (different layout)
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        html += `
                            <div class="alumni-card">
                                <img class="alumni-photo" src="${data.photoUrl || 'https://via.placeholder.com/120x120?text=Alumni'}" alt="${data.name}">
                                <div class="alumni-name">${data.name}</div>
                                <div class="alumni-batch">🎓 Batch ${data.batch || '-'}</div>
                                <div class="alumni-profession">${data.profession || ''}</div>
                                <div class="alumni-achievement">${data.achievement || ''}</div>
                                ${data.message ? `<div class="alumni-message">"${data.message}"</div>` : ''}
                            </div>
                        `;
                    });
                } else {
                    // Competition & Toppers display
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const isTopper = category === 'topper';
                        
                        html += `
                            <div class="award-card">
                                <img class="award-photo" src="${data.photoUrl || 'https://via.placeholder.com/300x200?text=No+Image'}" alt="${data.name}">
                                <div class="award-name">${data.name}</div>
                                <div class="award-detail">${data.class || ''}</div>
                                ${isTopper ? `
                                    <div class="award-highlight">🏆 Rank ${data.rank || ''}</div>
                                    <div class="award-detail">📊 ${data.marks || ''}</div>
                                ` : `
                                    <div class="award-highlight">${data.position || ''}</div>
                                    <div class="award-detail">${data.achievement || ''}</div>
                                `}
                                <div class="award-meta">📅 ${data.year || ''}</div>
                            </div>
                        `;
                    });
                }

                container.innerHTML = html;

            } catch (error) {
                console.error('Error loading awards:', error);
                container.innerHTML = `
                    <div class="no-awards">
                        <span class="icon">❌</span>
                        <p>Error loading data. Please refresh.</p>
                    </div>
                `;
            }
        }

        // ===== TAB SWITCHING =====
        const tabs = document.querySelectorAll('.tab-btn');
        const tabContents = {
            competition: document.getElementById('tab-competition'),
            topper: document.getElementById('tab-topper'),
            alumni: document.getElementById('tab-alumni')
        };

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                // Remove active from all tabs
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');

                // Hide all tab contents
                Object.values(tabContents).forEach(content => {
                    content.classList.remove('active');
                });

                // Show selected tab
                const category = this.dataset.category;
                tabContents[category].classList.add('active');

                // Load data for the selected category
                const containerMap = {
                    competition: 'competitionContainer',
                    topper: 'topperContainer',
                    alumni: 'alumniContainer'
                };
                loadAwards(category, containerMap[category]);
            });
        });

        // ===== TOGGLE MENU =====
        function toggleMenu(event, element) {
            event.preventDefault();
            event.stopPropagation();
            const parent = element.closest('.nav-item');
            const menu = parent.querySelector('.dropdown-menu');
            if (!menu) return;
            document.querySelectorAll('.nav-item').forEach(nav => {
                if (nav !== parent) {
                    nav.classList.remove('active');
                    const m = nav.querySelector('.dropdown-menu');
                    if (m) m.style.display = 'none';
                }
            });
            if (parent.classList.contains('active')) {
                parent.classList.remove('active');
                menu.style.display = 'none';
            } else {
                parent.classList.add('active');
                menu.style.display = 'block';
            }
        }

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.nav-item')) {
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('active');
                    const menu = item.querySelector('.dropdown-menu');
                    if (menu) menu.style.display = 'none';
                });
            }
        });

        function showPage(pageName) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                const menu = item.querySelector('.dropdown-menu');
                if (menu) menu.style.display = 'none';
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
            window.location.href = `index.html#${pageName}`;
        }

        // ===== LOAD DEFAULT TAB =====
        document.addEventListener('DOMContentLoaded', function() {
            loadAwards('competition', 'competitionContainer');
        });
    </script>

</body>
</html>
